<div class="week-card">
    <div class="week-header d-flex justify-content-between align-items-start">
        <div>
            <h5 class="week-number">Semana {{ semana.numero }}</h5>
            <h6 class="week-title">{{ semana.titulo }}</h6>
        </div>
        <div class="week-status">
            {% if semana.estado == 'Completada' %}
                <span class="badge bg-success">
                    <i class="bi bi-check-circle"></i> Completada
                </span>
            {% elif semana.estado == 'En progreso' %}
                <span class="badge bg-warning text-dark">
                    <i class="bi bi-hourglass-split"></i> En progreso
                </span>
            {% else %}
                <span class="badge bg-secondary">
                    <i class="bi bi-circle"></i> Pendiente
                </span>
            {% endif %}
        </div>
    </div>
    
    <div class="week-content mt-3">
        <p class="week-progress-text mb-2">
            {{ semana.retos_completados }} de {{ semana.total_retos }} retos
        </p>
        
        <div class="progress week-progress-bar">
            <div class="progress-bar" 
                 role="progressbar" 
                 style="width: {{ semana.porcentaje }}%" 
                 aria-valuenow="{{ semana.porcentaje }}" 
                 aria-valuemin="0" 
                 aria-valuemax="100">
                {{ semana.porcentaje }}%
            </div>
        </div>
        
        <div class="week-link mt-2">
            <a href="{% url 'weeks:detail' semana.numero %}" class="text-decoration-none">
                <small>Ver detalles <i class="bi bi-arrow-right"></i></small>
            </a>
        </div>
    </div>
</div>
