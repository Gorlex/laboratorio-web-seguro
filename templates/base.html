<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Laboratorios Web Seguros{% endblock %}</title>
    <!-- CSS Estándar -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Header Principal -->
    <header class="bg-dark text-white shadow-sm">
        <div class="container-fluid">
            <div class="row align-items-center py-2">
                <div class="col-md-3 col-6">
                    <h1 class="h5 mb-0">Laboratorios Web Seguros</h1>
                </div>
                <div class="col-md-6 d-none d-md-block text-center">
                    <!-- Espacio para logotipo -->
                    <div class="logo-placeholder bg-secondary rounded" style="width: 50px; height: 50px; margin: 0 auto;"></div>
                </div>
                <div class="col-md-3 col-6 text-end">
                    <div class="d-flex align-items-center justify-content-end">
                        <button class="btn btn-link text-white p-0 me-3" type="button" title="Notificaciones">
                            <i class="bi bi-bell"></i>
                        </button>
                        <div class="d-flex align-items-center">
                            <span class="me-2">Estudiante</span>
                            <div class="bg-secondary rounded-circle d-flex align-items-center justify-content-center" style="width: 36px; height: 36px;">
                                <i class="bi bi-person"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="container-fluid mt-3">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-light text-center py-3 mt-5">
        <div class="container">
            <p>&copy; 2026 Laboratorios Web Seguros. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- JavaScript Estándar -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
