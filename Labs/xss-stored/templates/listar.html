<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlphaPortal - Notas Médicas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="{{ url_for('static', filename='xss-validator.js') }}"></script>
</head>
<body>
    <div class="container mt-4">
        <h1>AlphaPortal - Notas Médicas</h1>
        <div class="row mb-4">
            <div class="col-md-6">
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Volver al Inicio</a>
            </div>
        </div>
            
        <div class="row">
            <div class="col-md-8">
                <h2>Notas Médicas</h2>
            {% if notas %}
                {% for nota in notas %}
                        <div class="card mb-3">
                            <div class="card-body">
                                <div class="nota-content" data-nota-id="{{ nota.id }}">
                                    {{ nota.nota | safe }}
                        </div>
                            </div>
                        </div>
                    {% endfor %}
                {% else %}
                    <p>No hay notas médicas disponibles.</p>
                {% endif %}
            </div>

            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5>Agregar Nota Médica</h5>
        </div>
                    <div class="card-body">
                        <form method="POST" action="{{ url_for('guardar') }}">
                            <div class="mb-3">
                                <label for="paciente" class="form-label">Paciente</label>
                                <input type="text" class="form-control" id="paciente" name="paciente" required>
    </div>
                            <div class="mb-3">
                                <label for="nota" class="form-label">Nota Médica</label>
                                <textarea class="form-control" id="nota" name="nota" rows="4" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">Guardar Nota</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
