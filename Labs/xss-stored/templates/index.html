<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Nota Médica</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .form-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .form-container h1 {
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-weight: 600;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }
        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <div class="user-info" style="float: right;">
                👤 {{ usuario }}
            </div>
            
            <div class="nav-buttons">
                <a href="{{ url_for('dashboard') }}" class="btn btn-primary">← Volver al Portal</a>
                <a href="{{ url_for('listar') }}" class="btn btn-secondary">Ver Notas</a>
            </div>
            
            <h1>📝 Agregar Nota Médica</h1>
            
            <form action="{{ url_for('guardar') }}" method="POST">
                <div class="form-group">
                    <label for="paciente">Nombre del Paciente:</label>
                    <input type="text" id="paciente" name="paciente" required>
                </div>
                
                <div class="form-group">
                    <label for="nota">Nota Médica:</label>
                    <textarea id="nota" name="nota" required></textarea>
                </div>
                
                <button type="submit" class="btn btn-secondary">Guardar Nota</button>
            </form>
        </div>
    </div>
</body>
</html>
